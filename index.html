  <script>
    (function () {
      const VOLNOREZ_HOST = 'https://volnorez.com';
      const GARBAGE_TEXTS = new Set(['test', 'test1']);

      function normalizeUrl(url) {
        if (!url) return url;
        if (url.startsWith('//')) return 'https:' + url;
        if (url.startsWith('/')) return VOLNOREZ_HOST + url;
        return url;
      }

      function isGarbageText(text) {
        if (!text) return false;
        return GARBAGE_TEXTS.has(text.trim().toLowerCase());
      }

      function cleanGarbage(root = document.body) {
        if (!root) return;

        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
        const textNodes = [];

        while (walker.nextNode()) {
          const node = walker.currentNode;
          if (isGarbageText(node.nodeValue)) {
            textNodes.push(node);
          }
        }

        textNodes.forEach((node) => {
          const parent = node.parentElement;
          if (!parent) return;

          const parentText = (parent.textContent || '').trim().toLowerCase();

          if (GARBAGE_TEXTS.has(parentText)) {
            parent.style.display = 'none';
          } else {
            node.nodeValue = '';
          }
        });

        root.querySelectorAll?.('input, textarea').forEach((el) => {
          const val = (el.value || '').trim().toLowerCase();
          if (GARBAGE_TEXTS.has(val)) el.value = '';
          const ph = (el.getAttribute('placeholder') || '').trim().toLowerCase();
          if (GARBAGE_TEXTS.has(ph)) el.setAttribute('placeholder', '');
        });
      }

      function fixSmileImages() {
        const chatRoot = document.querySelector('#volnorez_chat');
        if (!chatRoot) return;

        chatRoot.querySelectorAll('img').forEach((img) => {
          const cls = (img.className || '').toLowerCase();
          let src = img.getAttribute('src') || '';
          const dataSrc = img.getAttribute('data-src') || '';
          const srcset = img.getAttribute('srcset') || '';

          if (!src && dataSrc) {
            src = dataSrc;
          }

          if (src) img.setAttribute('src', normalizeUrl(src));
          if (srcset) {
            const fixedSrcset = srcset
              .split(',')
              .map(part => {
                const trimmed = part.trim();
                const spaceIdx = trimmed.indexOf(' ');
                if (spaceIdx === -1) return normalizeUrl(trimmed);
                const url = trimmed.slice(0, spaceIdx);
                const size = trimmed.slice(spaceIdx + 1);
                return normalizeUrl(url) + ' ' + size;
              })
              .join(', ');
            img.setAttribute('srcset', fixedSrcset);
          }

          const finalSrc = (img.getAttribute('src') || '').toLowerCase();

          const isSmile =
            finalSrc.includes('smile') ||
            finalSrc.includes('smiley') ||
            finalSrc.includes('/plugins/wchat/') ||
            finalSrc.includes('/static/smileys/') ||
            cls.includes('smile_');

          const isMeme =
            finalSrc.includes('mem') ||
            finalSrc.includes('gif') ||
            cls.includes('mem');

          if (isSmile) {
            img.style.width = 'auto';
            img.style.height = 'auto';
            img.style.maxWidth = 'none';
            img.style.maxHeight = 'none';
            img.style.verticalAlign = 'middle';
            img.style.margin = '0 3px';
            img.style.transform = 'scale(1.22)';
            img.style.transformOrigin = 'left center';
          }

          if (isMeme) {
            img.style.maxWidth = '180px';
            img.style.height = 'auto';
            img.style.display = 'inline-block';
          }

          if (!img.dataset.fixBound) {
            img.dataset.fixBound = '1';
            img.addEventListener('error', function onError() {
              const current = img.getAttribute('src') || '';
              const fixed = normalizeUrl(current);
              if (fixed && fixed !== current) {
                img.src = fixed;
              } else {
                img.style.display = 'none';
              }
            });
          }
        });
      }

      function boostSmileBackgrounds() {
        const chatRoot = document.querySelector('#volnorez_chat');
        if (!chatRoot) return;

        chatRoot.querySelectorAll('[class*="smile_"]').forEach((el) => {
          const style = window.getComputedStyle(el);
          const bg = style.backgroundImage || '';
          if (bg && bg !== 'none') {
            el.style.display = 'inline-block';
            el.style.verticalAlign = 'middle';
            el.style.transform = 'scale(1.16)';
            el.style.transformOrigin = 'left center';
            el.style.margin = '0 2px';
          }
        });
      }

      function runFixes(root) {
        cleanGarbage(root || document.body);
        fixSmileImages();
        boostSmileBackgrounds();
      }

      function scheduleFixes() {
        runFixes(document.body);
        setTimeout(() => runFixes(document.body), 900);
        setTimeout(() => runFixes(document.body), 1800);
        setTimeout(() => runFixes(document.body), 3200);
      }

      window.addEventListener('load', scheduleFixes);
      document.addEventListener('DOMContentLoaded', scheduleFixes);

      const observer = new MutationObserver((mutations) => {
        let shouldRun = false;

        for (const mutation of mutations) {
          mutation.addedNodes.forEach((node) => {
            if (node.nodeType === Node.TEXT_NODE) {
              if (isGarbageText(node.nodeValue)) {
                const parent = node.parentElement;
                if (parent) parent.style.display = 'none';
              }
              shouldRun = true;
            } else if (node.nodeType === Node.ELEMENT_NODE) {
              shouldRun = true;
            }
          });
        }

        if (shouldRun) runFixes(document.body);
      });

      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
    })();
  </script>
