    *{box-sizing:border-box}

    html,body{

      color:var(--text);
      font-family:Tahoma, Arial, sans-serif;
      min-height:100%;

    body{

    }

      background:linear-gradient(#efefef,#dddddd);

      border:1px solid #bdbdbd;

      padding:26px 24px 18px;

    .title{
      text-align:center;
      font-size:34px;
      font-weight:800;
      letter-spacing:.3px;
      color:#2f3540;
      margin:0 0 18px;
    }

    .frame{
      background:#dfdfdf;
      border-radius:14px;
      border:1px solid #bbbbbb;
      box-shadow:
        0 1px 0 #fdfdfd inset,
        0 -1px 0 #d0d0d0 inset;
      padding:18px;
    }

    .player-panel{
      background:linear-gradient(#f1f1f1,#e3e3e3);
      border-radius:12px;
      border:1px solid #b7b7b7;
      box-shadow:
        0 1px 0 #fff inset,
        0 -1px 0 #cfcfcf inset;
      padding:12px 14px;
      margin-bottom:16px;
      overflow:hidden;
    }

    .chat-shell{
      position:relative;
      background:#d5d5d5;
      border-radius:12px;
      border:1px solid #b5b5b5;
      padding:0;
      overflow:hidden;
      min-height:620px;
    }

    .chat-shell::before{
      content:"";
      display:block;
      height:12px;
      background:linear-gradient(#b8cfe0,#8eacc4);
      border-bottom:1px solid #7e97ab;
      box-shadow:0 1px 0 rgba(255,255,255,.65) inset;
    }

    .gear{
      position:absolute;
      top:5px;
      left:8px;
      z-index:5;
      width:24px;
      height:24px;
      border-radius:6px;
      background:linear-gradient(#6fa3cf,#4c84b6);
      border:1px solid #3d6e98;
      color:#fff;
      font-size:15px;
      line-height:22px;
      text-align:center;
      box-shadow:0 1px 0 rgba(255,255,255,.35) inset;
      user-select:none;
      pointer-events:none;
    }

    .chat-body{
      background:#efefef;
      min-height:608px;
      padding:10px 10px 12px;
    }

    #volnorez_chat{
      width:100%;
      min-height:586px;
      display:block;
      background:#efefef;
    }

    /* Мягкая подстройка внешнего embed */
    #volnorez_chat,
    #volnorez_chat *{
      font-family:Tahoma, Arial, sans-serif !important;
    }

    /* Улучшение смайлов и мемов */
    #volnorez_chat img[src*="smile"],
    #volnorez_chat img[src*="smiley"],
    #volnorez_chat [class*="smile_"] img,
    #volnorez_chat .smile,
    #volnorez_chat [class*="smile_"]{
      max-width:none !important;
      max-height:none !important;
    }

    #volnorez_chat img[src*="smile"],
    #volnorez_chat img[src*="smiley"]{
      width:auto !important;
      height:auto !important;
      vertical-align:middle !important;
      margin:0 3px !important;
      image-rendering:auto;
    }

    #volnorez_chat img[src*="mem"],
    #volnorez_chat img[src*="gif"]{
      max-width:180px !important;
      height:auto !important;
    }

    /* Мобильная адаптация */
    @media (max-width: 900px){

        padding:14px 12px 12px;

      .title{

      .player-panel{

        margin-bottom:10px;
      }
      .chat-body{
        padding:8px;
      }
      #volnorez_chat{
        min-height:520px;
      }
    }

  <script>
    (function () {
      function isStandaloneTestText(text) {
        return !!text && text.trim().toLowerCase() === 'test';
      }

      function hideTestNode(node) {
        if (!node) return;

        const parent = node.parentElement;
        if (!parent) return;

        const text = (node.nodeValue || '').trim().toLowerCase();
        if (text !== 'test') return;

        const parentText = (parent.textContent || '').trim().toLowerCase();

        if (parentText === 'test') {
          parent.style.display = 'none';
          return;
        }

        node.nodeValue = '';
      }

      function cleanTests(root = document.body) {
        if (!root) return;

        const walker = document.createTreeWalker(
          root,
          NodeFilter.SHOW_TEXT,
          null
        );

        const nodesToClean = [];

        while (walker.nextNode()) {
          const node = walker.currentNode;
          if (isStandaloneTestText(node.nodeValue)) {
            nodesToClean.push(node);
          }
        }

        nodesToClean.forEach(hideTestNode);
      }

      function improveVolnorezSmiles(root = document) {
        const chatRoot = document.querySelector('#volnorez_chat');
        if (!chatRoot) return;

        chatRoot.querySelectorAll('img').forEach((img) => {
          const src = (img.getAttribute('src') || '').toLowerCase();
          const cls = (img.className || '').toLowerCase();

          const isSmile = src.includes('smile') || src.includes('smiley') || cls.includes('smile_');
          const isMeme = src.includes('mem') || src.includes('gif');

          if (isSmile) {
            img.style.width = 'auto';
            img.style.height = 'auto';
            img.style.maxWidth = 'none';
            img.style.maxHeight = 'none';
            img.style.verticalAlign = 'middle';
            img.style.transform = 'scale(1.3)';
            img.style.transformOrigin = 'left center';
            img.style.margin = '0 3px';
          }

          if (isMeme) {
            img.style.maxWidth = '180px';
            img.style.height = 'auto';
          }
        });
      }

      function runAllFixes(root) {
        cleanTests(root || document.body);
        improveVolnorezSmiles(root || document);
      }

      window.addEventListener('load', function () {
        runAllFixes(document.body);
        setTimeout(() => runAllFixes(document.body), 1200);
        setTimeout(() => runAllFixes(document.body), 2500);
      });

      const observer = new MutationObserver(function (mutations) {
        for (const mutation of mutations) {
          mutation.addedNodes.forEach((added) => {
            if (added.nodeType === Node.TEXT_NODE) {
              if (isStandaloneTestText(added.nodeValue)) {
                hideTestNode(added);
              }
            } else if (added.nodeType === Node.ELEMENT_NODE) {
              runAllFixes(added);
            }
          });
        }
      });

      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
    })();
  </script>
